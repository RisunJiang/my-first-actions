name: 每日定時天氣爬蟲

on:
  # 觸發條件 1：手動觸發（方便我們現在立刻測試）
  workflow_dispatch:
  
  # 觸發條件 2：定時自動觸發 (台北時間每天早上 8:00 執行)
  # 註：GitHub 使用的是 UTC 時間，台北時間 (UTC+8) 早上 8 點就是 UTC 的 0:00
  schedule:
    - cron: '0 0 * * *'

jobs:
  run-weather-bot:
    runs-on: ubuntu-latest

    steps:
      - name: 1. 複製專案程式碼到雲端電腦
        uses: actions/checkout@v4

      - name: 2. 設定 Python 環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10' # 指定使用 Python 3.10 版本

      - name: 3. 執行 Python 爬蟲腳本
        run: python weather_bot.py
