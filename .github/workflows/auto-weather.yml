name: 每日定時天氣爬蟲

on:
  # 觸發條件 1：手動觸發（方便我們現在立刻測試）
  workflow_dispatch:
  
  # 觸發條件 2：定時自動觸發 (北京时间每天早上 8:00 执行)
  # 注：GitHub 使用的是 UTC 時間，北京时间 (UTC+8) 早上 8 点就是 UTC 的 0:00
  schedule:
    - cron: '25 8 * * *'

jobs:
  run-weather-bot:
    runs-on: ubuntu-latest

    steps:
      - name: 1. 复制项目程序码到云端电脑
        uses: actions/checkout@v4

      - name: 2. 设定 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10' # 指定使用 Python 3.10 版本

      - name: 3. 執行 Python 执行爬虫脚本
        run: python weather_bot.py
